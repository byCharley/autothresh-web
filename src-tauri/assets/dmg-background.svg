<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380">
  <defs>
    <!-- Matches app: rgba(255,255,255,0.09) 1px dot, 28px spacing -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#ffffff" opacity="0.09"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="660" height="380" fill="#0a0a0a"/>
  <rect width="660" height="380" fill="url(#dots)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="660" height="2" fill="#f5a020"/>

  <!-- Logo mark — top center -->
  <text
    x="330" y="44"
    font-family="'Courier New', Courier, monospace"
    font-size="12" font-weight="700" letter-spacing="7"
    text-anchor="middle" fill="#f5a020">AUTOTHRESH</text>

  <!-- Sub label -->
  <text
    x="330" y="60"
    font-family="'Courier New', Courier, monospace"
    font-size="8" letter-spacing="4"
    text-anchor="middle" fill="rgba(255,255,255,0.25)">WEB · SCREEN PRINT SEPARATION</text>

  <!-- Hairline separator -->
  <line x1="260" y1="72" x2="400" y2="72" stroke="#f5a020" stroke-width="0.5" opacity="0.35"/>

  <!-- Arrow between app icon (x=195) and Applications (x=465), centered at x=330 y=160 -->
  <line x1="290" y1="160" x2="356" y2="160" stroke="#f5a020" stroke-width="1.5" opacity="0.65"/>
  <polygon points="348,153 366,160 348,167" fill="#f5a020" opacity="0.65"/>

  <!-- Drag instruction — below the icons (icons at y=160, ~80px tall, so ~200+) -->
  <text
    x="330" y="244"
    font-family="'Courier New', Courier, monospace"
    font-size="9" letter-spacing="1.5"
    text-anchor="middle" fill="rgba(255,255,255,0.35)">DRAG TO APPLICATIONS TO INSTALL</text>

  <!-- Footer domain -->
  <text
    x="330" y="368"
    font-family="'Courier New', Courier, monospace"
    font-size="8" letter-spacing="3"
    text-anchor="middle" fill="rgba(255,255,255,0.12)">AUTOTHRESH.COM</text>

  <!-- Bottom accent line -->
  <rect x="0" y="378" width="660" height="2" fill="#f5a020" opacity="0.3"/>
</svg>
