<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#ffffff" opacity="0.09"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="#0a0a0a"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="640" height="2" fill="#FF6B1A"/>

  <!-- AUTOTHRESH WEB wordmark -->
  <text x="320" y="44"
    font-family="'JetBrains Mono', Menlo, 'Courier New', monospace"
    font-size="11" font-weight="700" letter-spacing="6"
    text-anchor="middle" fill="#FF6B1A">AUTOTHRESH WEB</text>

  <!-- Drag instruction -->
  <text x="320" y="62"
    font-family="'JetBrains Mono', Menlo, 'Courier New', monospace"
    font-size="8" letter-spacing="2"
    text-anchor="middle" fill="rgba(255,255,255,0.35)">DRAG TO APPLICATIONS FOLDER TO INSTALL</text>

  <!-- Separator line -->
  <line x1="230" y1="74" x2="410" y2="74" stroke="#FF6B1A" stroke-width="0.5" opacity="0.35"/>

  <!-- Arrow between icons (app ≈ x=165, applications ≈ x=425, center ≈ x=295) -->
  <line x1="258" y1="150" x2="328" y2="150" stroke="#FF6B1A" stroke-width="1.5" opacity="0.6"/>
  <polygon points="320,143 336,150 320,157" fill="#FF6B1A" opacity="0.6"/>

  <!-- Footer -->
  <text x="320" y="350"
    font-family="'JetBrains Mono', Menlo, 'Courier New', monospace"
    font-size="7" letter-spacing="3"
    text-anchor="middle" fill="rgba(255,255,255,0.1)">AUTOTHRESH.COM</text>

  <!-- Bottom accent line -->
  <rect x="0" y="358" width="640" height="2" fill="#FF6B1A" opacity="0.25"/>
</svg>
