<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#ffffff" opacity="0.09"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="#0a0a0a"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="640" height="2" fill="#f5a020"/>

  <!-- AUTOTHRESH WEB — top center -->
  <text x="320" y="44"
    font-family="'Courier New', Courier, monospace"
    font-size="11" font-weight="700" letter-spacing="6"
    text-anchor="middle" fill="#f5a020">AUTOTHRESH WEB</text>

  <!-- Drag instruction — just below the wordmark -->
  <text x="320" y="62"
    font-family="'Courier New', Courier, monospace"
    font-size="8" letter-spacing="2"
    text-anchor="middle" fill="rgba(255,255,255,0.3)">DRAG TO APPLICATIONS FOLDER TO INSTALL</text>

  <!-- Thin separator -->
  <line x1="230" y1="74" x2="410" y2="74" stroke="#f5a020" stroke-width="0.5" opacity="0.35"/>

  <!-- Arrow between app icon (x≈165) and Applications (x≈425), centered ~295 -->
  <line x1="258" y1="160" x2="328" y2="160" stroke="#f5a020" stroke-width="1.5" opacity="0.6"/>
  <polygon points="320,153 336,160 320,167" fill="#f5a020" opacity="0.6"/>

  <!-- Footer -->
  <text x="320" y="350"
    font-family="'Courier New', Courier, monospace"
    font-size="7" letter-spacing="3"
    text-anchor="middle" fill="rgba(255,255,255,0.1)">AUTOTHRESH.COM</text>

  <!-- Bottom accent line -->
  <rect x="0" y="358" width="640" height="2" fill="#f5a020" opacity="0.25"/>
</svg>
